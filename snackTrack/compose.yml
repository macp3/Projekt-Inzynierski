services:
  snacktrack-db:
    container_name: snacktrack-db
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: snackTrackDB
      MYSQL_USER: myuser
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: verysecret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - snacktrack-network

  snacktrack-app:
    container_name: snacktrack-app
    build: .
    depends_on:
      - snacktrack-db
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://snacktrack-db:3306/snackTrackDB
      SPRING_DATASOURCE_USERNAME: myuser
      SPRING_DATASOURCE_PASSWORD: secret
      SPRING_SQL_INIT_MODE: always
    ports:
      - "8080:8080"
    networks:
      - snacktrack-network

volumes:
  mysql_data:

networks:
  snacktrack-network:
    driver: bridge
